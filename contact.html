<body>
    <header>
        <div class="container">
            <div class="logo">
                <a href="../" class="logo-text">Maturity Test</a>

                <ul>

                <span></span>

    <main>
        <section class="contact-section">
            <div class="container">
                <h1>Contact Us</h1>
                <p>Have questions or feedback about our Maturity Test? Feel free to reach out to us.</p>
                <form id="contact-form" onsubmit="event.preventDefault(); alert('Thank you for your message, we will reply as soon as possible!'); this.reset();">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn">Send Message</button>
                </form>
            </div>
        </section>
    </main>
